<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Congress Session Console</title>
<style>
:root{
  --navy:#14284B; --navy2:#1F3864; --navy3:#2A4A80; --gold:#D4AF37; --gold2:#F1D67A;
  --paper:#F7F4EC; --ink:#1B1B1B; --muted:#6B7280; --line:#D9D4C7;
  --yes:#2E8B57; --no:#C0392B; --abs:#B7950B; --warn:#E0A800; --red:#C0392B;
  --edu:#4F81BD; --hlt:#2E8B57; --gov:#8064A2; --ict:#E46C0A; --env:#76923C;
  --dock:#0E1A30; --dock2:#16264A; --dockline:#2C3F66; --docktext:#DCE3F0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B1424;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden}
button{font-family:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#main{flex:1;min-height:0;display:flex}
#leftCol{flex:1;min-width:0;display:flex;flex-direction:column}
#top,#side,#ctx,.lbl,#prog,#center{display:none}
body.op #leftCol{display:none}
body.op #prog{display:flex}
body.op #center{display:flex}
body.op #top{display:flex}
body.op #side{display:flex}

body.op .lbl{display:flex}
body.op #main{gap:10px;padding:8px 10px}
#ctx{display:none!important}
body.op #stageWrap{border-radius:10px;border:2px solid #2C3F66;background:#070D18}
.lbl{align-items:center;gap:8px;color:#9FB0D0;font-size:12px;font-weight:800;letter-spacing:.12em;padding:2px 2px 6px}
.livedot{width:10px;height:10px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 4px rgba(229,72,77,.25)}
#top{background:var(--dock);border-bottom:2px solid var(--gold);padding:6px 10px;gap:8px;align-items:center;flex-wrap:nowrap;color:var(--docktext);white-space:nowrap}
#top select{min-width:120px;flex:0 1 300px}
@media (max-width:1600px){#top .ttl small{display:none}#top .ttl{font-size:12px}}
@media (max-width:1500px){#top .ttl{display:none}}
#top .logo{height:38px}
#top .ttl{font-weight:800;letter-spacing:.06em;font-size:14px;line-height:1.1}
#top .ttl small{display:block;color:var(--gold2);font-weight:600;font-size:11px;letter-spacing:.05em}
.bigbtn{font-size:15px!important;padding:9px 14px!important;font-weight:700}
.navbtn{font-size:18px!important;padding:8px 16px!important;font-weight:800}
.status{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.status.on{background:#1E5E3C;color:#BFF0D3}.status.off{background:#3A2A2A;color:#F4C7C3}
.status i{width:9px;height:9px;border-radius:50%;display:inline-block}
.status.on i{background:#4ADE80}.status.off i{background:#F87171}
.topclock{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold2)}
#side{width:392px;flex:none;flex-direction:column;gap:10px;overflow:auto;color:var(--docktext)}
.panel{background:var(--dock2);border:1px solid var(--dockline);border-radius:10px;padding:10px}
.panel h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:var(--gold2)}
#nextBox{width:366px;height:206px;position:relative;overflow:hidden;border-radius:6px;background:#000;pointer-events:none}
#nextInner{width:1600px;height:900px;transform:scale(.22875);transform-origin:top left;position:absolute;left:0;top:0;background:var(--paper);overflow:hidden}
.tbig{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;border-radius:10px;padding:4px 0;margin-bottom:8px;color:#fff;background:#23704A}
.tbig.y{background:var(--warn);color:#222}.tbig.r{background:var(--red)}.tbig.idle{background:#24365E}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{border:1px solid #3A5287;background:#24365E;color:#fff;border-radius:8px;padding:10px 8px;font-weight:800;font-size:14px;cursor:pointer;text-align:center}
.tile small{display:block;font-weight:500;font-size:11px;color:#BFC9DD;margin-top:2px}
.tile.red{background:#7E241D;border-color:#B5473E}.tile.on{outline:3px solid var(--gold2)}
#ctx{background:var(--dock);border-top:2px solid var(--gold);padding:6px 10px;gap:6px;flex-direction:column;color:var(--docktext);font-size:12px;max-height:30vh;overflow:auto}
#fsHint{position:fixed;inset:0;background:rgba(8,16,32,.92);color:#fff;display:none;align-items:center;justify-content:center;text-align:center;z-index:999;cursor:pointer}
.logoT{height:150px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.bpLogo{filter:drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 0 2px rgba(255,255,255,.85)) drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.hdr .hlogo{height:46px;margin-right:4px}
#stageWrap{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--paper);overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
/* header bar */
.hdr{position:absolute;left:0;right:0;top:0;height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 28px;gap:20px;border-bottom:4px solid var(--gold)}
.hdr .brand{font-weight:800;letter-spacing:.06em;font-size:20px}
.hdr .brand small{display:block;font-weight:500;letter-spacing:.04em;font-size:12px;color:var(--gold2)}
.hdr .seg{flex:1;text-align:center;font-size:18px;font-weight:600;color:#E8EDF7}
.hdr .clock{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;color:var(--gold2)}
.hdr .elapsed{font-size:12px;color:#B8C3DA;text-align:right}
.ftr{position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--navy2);color:#C9D3E6;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px}
.body{position:absolute;left:0;right:0;top:68px;bottom:40px;padding:34px 56px}
h1.t{font-size:54px;margin:0 0 10px;color:var(--navy);letter-spacing:.01em}
h2.t{font-size:34px;margin:0 0 18px;color:var(--navy2)}
.kicker{font-size:18px;font-weight:700;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.lead{font-size:26px;line-height:1.45;color:#333}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.role{font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.name{font-size:30px;font-weight:700;color:var(--navy)}
.rep{font-size:19px;color:var(--muted)}
/* title slide */
.titleSlide{position:absolute;inset:0;background:radial-gradient(1200px 600px at 50% 30%,#22407A,#0F1F3D);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.titleSlide .frame{position:absolute;inset:28px;border:3px solid var(--gold);border-radius:6px;pointer-events:none}
.titleSlide .inst{color:var(--gold2);letter-spacing:.2em;font-weight:700;font-size:22px}
.titleSlide .big{font-size:92px;font-weight:900;letter-spacing:.02em;margin:10px 0}
.titleSlide .sub{font-size:36px;font-weight:600}
.titleSlide .sub2{font-size:26px;color:var(--gold2);font-weight:700;margin-top:6px}
.titleSlide .meta{margin-top:26px;font-size:22px;color:#D6DEEE}
.titleSlide .bigclock{margin-top:30px;font-size:76px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
.titleSlide .cd{font-size:24px;color:var(--gold2);margin-top:4px}
.seal{width:110px;height:110px;border-radius:50%;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold2);font-size:16px;letter-spacing:.1em;background:rgba(255,255,255,.05)}
/* member grid */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.m{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fff;font-size:14px;line-height:1.15;display:flex;align-items:center;gap:8px;min-height:40px;user-select:none}
.m .nm{font-weight:700;color:#222}
.m .rp{font-size:11px;color:var(--muted)}
.m .dot{width:10px;height:10px;border-radius:50%;flex:none;background:#ccc}
.m.present{background:#E8F4EC;border-color:#9CCFB0}
.m.present .dot{background:var(--yes)}
.m.absent{opacity:.45}
.op .m.clickable{cursor:pointer}
.op .m.clickable:hover{outline:2px solid var(--gold)}
.m .v{margin-left:auto;font-weight:800;font-size:13px;border-radius:6px;padding:2px 7px;color:#fff}
.v.Y{background:var(--yes)} .v.N{background:var(--no)} .v.A{background:var(--abs)}
.m.vY{background:#E6F3EB;border-color:#9CCFB0}.m.vN{background:#FBE9E7;border-color:#E3A59D}.m.vA{background:#FBF4DC;border-color:#E2CF85}
.cmark{width:6px;align-self:stretch;border-radius:4px;flex:none}
/* quorum */
.meter{height:26px;background:#E5E1D6;border-radius:13px;position:relative;overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:var(--yes);transition:width .3s}
.meter .need{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--navy)}
.bigNum{font-size:84px;font-weight:900;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.ok{color:var(--yes)} .bad{color:var(--red)}
/* bill slide */
.billHead{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;font-size:16px;letter-spacing:.08em;color:#fff}
.billTitle{font-size:25px;line-height:1.35;font-weight:700;color:var(--navy);margin:6px 0 14px;max-height:170px;overflow:hidden}
.phases{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
.ph{padding:6px 12px;border-radius:8px;background:#ECE8DD;color:#666;font-weight:700;font-size:14px}
.ph.on{background:var(--navy);color:#fff}
.op .ph{cursor:pointer}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tbox{border-radius:12px;padding:12px 14px;color:#fff;text-align:center}
.tbox .n{font-size:48px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.tbox .l{font-size:15px;font-weight:700;letter-spacing:.14em}
.stamp{margin-top:10px;text-align:center;font-size:34px;font-weight:900;letter-spacing:.06em;padding:12px;border-radius:12px;border:5px solid}
.stamp.app{color:var(--yes);border-color:var(--yes);background:#EAF6EF}
.stamp.not{color:var(--red);border-color:var(--red);background:#FCECEA}
.queue .q{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;margin-bottom:6px;font-size:16px}
.queue .q .tag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gold)}
.queue .q.cur{border-color:var(--gold);background:#FFF7DD;box-shadow:0 0 0 2px var(--gold) inset}
.queue .q.done{opacity:.5}
.op .queue .q{cursor:pointer}
.scen{display:inline-block;background:#FBEDEC;border:1px solid #E3A59D;color:#943634;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}
.audienceOnly{} .opOnly{}
body:not(.op) .opOnly{display:none!important}
/* overlays */
.ovl{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
.ovl.susp{background:rgba(110,20,20,.98)}
.ovl.div{background:rgba(15,31,61,.98)}
.ovl.order{background:rgba(160,20,20,.92);animation:pulse 1s infinite alternate}
.ovl.quorum{background:rgba(15,31,61,.98)}
@keyframes pulse{from{background:rgba(160,20,20,.98)}to{background:rgba(115,10,10,.99)}}
.ovl .h{font-size:110px;font-weight:900;letter-spacing:.04em}
.ovl .s{font-size:34px;margin-top:10px;color:#F5E6B8}
.ovl .tm{font-size:90px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:20px}
.divGrid{display:grid;grid-template-columns:repeat(3,320px);gap:30px;margin-top:30px}
.divGrid .tbox .n{font-size:110px}
/* speaker timer & lower third */
#spkTimer{position:absolute;right:56px;bottom:58px;z-index:46;width:250px;border-radius:18px;padding:12px 16px;color:#fff;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35);display:none}
#spkTimer .tt{font-size:84px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
#spkTimer .tl{font-size:14px;font-weight:700;letter-spacing:.14em}
#spkTimer.g{background:var(--yes)} #spkTimer.y{background:var(--warn);color:#222} #spkTimer.r{background:var(--red);animation:blink .6s infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.7}}
#lower{position:absolute;left:0;right:0;bottom:40px;z-index:45;display:none}
#lower.full .bar{margin-right:56px}
#lower .bar{margin:0 330px 18px 56px;background:linear-gradient(90deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;border-left:10px solid var(--gold);border-radius:8px;padding:12px 22px;display:flex;align-items:center;gap:22px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#lower .lab{font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--gold2);text-transform:uppercase}
#lower .who{font-size:32px;font-weight:800}
#lower .wr{font-size:18px;color:#C9D3E6}
/* dock */
#dock{background:var(--dock);color:var(--docktext);border-top:2px solid var(--gold);padding:5px 8px;display:none;gap:4px;flex-direction:column;font-size:12px;max-height:34vh;overflow:auto}

.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp{display:flex;gap:4px;align-items:center;background:var(--dock2);border:1px solid var(--dockline);border-radius:8px;padding:3px 6px}
.grp b{font-size:11px;letter-spacing:.1em;color:var(--gold2);margin-right:4px;text-transform:uppercase}
.btn{background:#24365E;color:#fff;border:1px solid #3A5287;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#2F4677}
.btn.gold{background:var(--gold);color:#1a1a1a;border-color:#b8952a;font-weight:700}
.btn.red{background:#8E2A22;border-color:#B5473E}
.btn.green{background:#23704A;border-color:#2E8B57}
.btn.on{outline:2px solid var(--gold2)}
select,input[type=number],input[type=text]{background:#0B1424;color:#fff;border:1px solid #3A5287;border-radius:6px;padding:5px 6px;font-size:13px}
.stat{font-variant-numeric:tabular-nums;font-weight:700}
.chip{padding:3px 8px;border-radius:999px;font-weight:700;font-size:12px}
.chip.ok{background:#1E5E3C;color:#BFF0D3}.chip.late{background:#7A2A1F;color:#FFD6CF}.chip.early{background:#3B4E7A;color:#D7E2FF}
.help{color:#93A3C4;font-size:12px}
#menu{position:fixed;left:10px;top:60px;bottom:10px;width:360px;background:#0E1A30;border:1px solid var(--gold);border-radius:10px;z-index:100;display:none;overflow:auto;padding:8px}
#menu .mi{padding:7px 10px;border-radius:6px;color:#DCE3F0;cursor:pointer;font-size:14px;display:flex;gap:8px}
#menu .mi:hover{background:#1E2E52}
#menu .mi.cur{background:var(--gold);color:#111;font-weight:700}
#menu .mi .tm{color:#93A3C4;font-variant-numeric:tabular-nums;width:62px;flex:none}
#menu .mi.cur .tm{color:#333}
table.res{width:100%;border-collapse:collapse;font-size:18px;background:#fff}
table.res th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-size:15px;letter-spacing:.05em}
table.res td{border-bottom:1px solid var(--line);padding:9px 10px}
table.res td.num{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.rules li{font-size:26px;margin-bottom:14px;line-height:1.35}
.cal td{font-size:15px;padding:7px 9px;vertical-align:top}
.cal td.tt{font-size:13.5px}

#prog{width:250px;flex:none;flex-direction:column;background:var(--dock2);border:1px solid var(--dockline);border-radius:10px;overflow:auto;padding:6px}
#prog .pi{display:flex;gap:8px;padding:6px 8px;border-radius:6px;color:#DCE3F0;cursor:pointer;font-size:12.5px;line-height:1.25;align-items:flex-start}
#prog .pi:hover{background:#22355E}
#prog .pi.cur{background:var(--gold);color:#111;font-weight:700}
#prog .pi .tm{color:#93A3C4;width:52px;flex:none;font-variant-numeric:tabular-nums}
#prog .pi.cur .tm{color:#333}
#prog .pi .ck{margin-left:auto;color:#4ADE80;font-weight:900}
#prog h4{margin:4px 8px 6px;font-size:11px;letter-spacing:.14em;color:var(--gold2)}
#center{flex:1;min-width:0;flex-direction:column;gap:10px;overflow:auto;color:var(--docktext)}
.nowhead{background:var(--dock2);border:1px solid var(--dockline);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:14px}
.nowhead .k{font-size:11px;letter-spacing:.14em;color:var(--gold2);font-weight:800}
.nowhead .t{font-size:22px;font-weight:800;color:#fff}
.cue{background:#1B2B4F;border-left:4px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.45}
.cue.scn{background:#3A1D1B;border-left-color:#E07A6E}
.people{display:flex;flex-wrap:wrap;gap:6px}
.pp{display:flex;align-items:center;gap:8px;background:#24365E;border:1px solid #3A5287;border-radius:8px;padding:6px 8px;font-size:13px}
.pp .pn{font-weight:700;color:#fff}.pp .pr{font-size:11px;color:#AFC0DE}
.pp .btn{padding:3px 7px}
.attgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.att{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;background:#1C2C50;border:1px solid #33497A;cursor:pointer;font-size:12.5px;user-select:none}
.att .cm{width:5px;align-self:stretch;border-radius:3px}
.att.on{background:#1E5E3C;border-color:#3FA06A}
.att small{display:block;color:#AFC0DE;font-size:10.5px}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.vr{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:7px;background:#1C2C50;border:1px solid #33497A;font-size:12px}
.vr.abs{opacity:.45}
.vr .cm{width:5px;align-self:stretch;border-radius:3px}
.vr .vn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb{width:30px;height:26px;border-radius:6px;border:1px solid #3A5287;background:#24365E;color:#C9D3E6;font-weight:800;font-size:12px;cursor:pointer}
.vb.Y.on{background:var(--yes);color:#fff;border-color:var(--yes)}.vb.N.on{background:var(--no);color:#fff;border-color:var(--no)}.vb.A.on{background:var(--abs);color:#fff;border-color:var(--abs)}
.ctally{display:flex;gap:8px;align-items:stretch}
.ctally .b{flex:1;border-radius:8px;text-align:center;padding:6px;color:#fff}
.ctally .b .n{font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ctally .b .l{font-size:11px;font-weight:800;letter-spacing:.12em}
.stepbar{display:flex;gap:4px;flex-wrap:wrap}
.stepbar .btn{font-size:13px;padding:7px 10px}
.qrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:#1C2C50;border:1px solid #33497A;margin-bottom:4px;font-size:13px}
.qrow.cur{border-color:var(--gold);background:#3A3214}
.qrow.done{opacity:.55}
.thumbs{display:grid;grid-template-columns:1fr;gap:8px}
.thumb{width:366px;height:206px;position:relative;overflow:hidden;border-radius:6px;background:#000;pointer-events:none}
.thumb .in{width:1600px;height:900px;transform:scale(.22875);transform-origin:top left;position:absolute;left:0;top:0;background:var(--paper);overflow:hidden}
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <div id="main">
    <div id="prog"></div>
    <div id="center"></div>
    <div id="leftCol"><div class="lbl" id="liveLbl"><span class="livedot"></span>ON THE PROJECTOR NOW <span class="help" style="margin-left:8px">(you can click names on this preview to mark attendance and votes)</span></div>
      <div id="stageWrap"><div id="stage"></div></div></div>
    <div id="side"></div>
  </div>
  <div id="ctx"></div>
</div>
<div id="menu"></div>
<div id="fsHint"><div><div style="font-size:42px;font-weight:800">Projector screen ready</div><div style="font-size:22px;margin-top:10px">Click anywhere on this screen once to go fullscreen.</div><div style="font-size:16px;margin-top:16px;color:#BFC9DD">Then go back to the laptop. All controls stay on the laptop screen.</div></div></div>

  if(o.type==='order') return `<div class="ovl order"><div class="h" style="font-size:150px">ORDER!</div><div class="s">Order in the House</div></div>`;
  if(o.type==='div'){const d=st.division;return `<div class="ovl div"><div class="kicker" style="color:var(--gold2)">Verification of the Vote</div><div class="h" style="font-size:90px">DIVISION OF THE HOUSE</div>${d.title&&d.title!=='Division of the House'?`<div class="s">${esc(d.title)}</div>`:''}

function render(){
  document.body.classList.toggle('op',!isAudience && !st._present);
  document.getElementById('fsHint').style.display=(isAudience && !document.fullscreenElement && !fsDismissed)?'flex':'none';
  document.title = isAudience?'Model Congress Projector':'Model Congress Session Console';
  const s=S[st.slide]; const stage=$('#stage');
  let vid=document.getElementById('anthemVid'); if(vid) vid.remove();
  stage.innerHTML = R[s.type](s) + overlayHtml() + `<div id="spkTimer"><div class="tl" id="spkLab">EXPLANATION OF VOTE</div><div class="tt" id="spkTime">1:00</div><div class="tl" id="spkWho"></div></div><div id="lower">${lowerHtml()}</div>`;
  $('#lower').style.display=st.lower?'block':'none';
  syncAnthem(vid);
  if(!isAudience && !st._present) renderControls();
  fit(); requestAnimationFrame(fit); tick();
}
let lastAnSeq=-1;
function syncAnthem(vid){
  const slot=document.getElementById('vidSlot');
  if(!slot){ if(vid){vid.pause();} return; }
  const A=st.anthem||{state:'stopped',seq:0,file:ANTHEM_DEFAULT};
  const useBlob = A.picked && anthemBlobUrl;
  const key = useBlob ? ('blob:'+anthemBlobName) : A.file;
  if(!vid || vid.dataset.file!==key){
    vid=document.createElement('video'); vid.id='anthemVid'; vid.dataset.file=key; vid.src=useBlob?anthemBlobUrl:encodeURI(A.file); vid.preload='auto'; vid.playsInline=true;
    vid.style.cssText='width:100%;height:100%;object-fit:contain;background:#000';
    vid.addEventListener('error',()=>{vid.dataset.err='1';report();});
    vid.addEventListener('loadedmetadata',report); vid.addEventListener('ended',()=>{slot.style.display='none';report();});
    lastAnSeq=-1;
  }
  slot.appendChild(vid);
  slot.style.display=(A.state==='stopped'||vid.dataset.err)?'none':'block';
  if(A.seq!==lastAnSeq){
    lastAnSeq=A.seq;
    if(A.state==='playing'){ if(A.restart){vid.currentTime=0;} const p=vid.play(); if(p&&p.catch) p.catch(err=>{report('Playback was blocked: click once on the projector screen, then press Play again.');}); }
    else if(A.state==='paused'){ vid.pause(); }
    else { vid.pause(); try{vid.currentTime=0}catch(e){} }
  }
  report();
}
function report(msg){
  const v=document.getElementById('anthemVid'); if(!v) return;
  const d={t:'anthem',cur:v.currentTime||0,dur:isFinite(v.duration)?v.duration:0,paused:v.paused,ended:v.ended,err:v.dataset.err?('Cannot play: '+v.dataset.file.replace(/^blob:/,'')):'',src:v.dataset.file.startsWith('blob:')?'picked':'folder',msg:msg||''};
  if(isAudience){ try{window.opener&&window.opener.postMessage(d,'*')}catch(e){} } else { anthemStat=d; }
}
setInterval(()=>{ if(document.getElementById('anthemVid')) report(); },500);
function anthemStatusHtml(){
  const a=anthemStat;
  if(!a) return `<span class="help">${(audWin&&!audWin.closed)?'Waiting for the projector...':'Open the projector first (START PRESENTATION). The anthem plays from the projector window.'}</span>`;
  if(a.err) return `<b style="color:#FF9C92">${esc(a.err)}</b> <span class="help">Use "Choose video file" to pick the MP4 directly.</span>`;
  const f=x=>mmss(x*1000);
  return `<b style="font-size:16px">${a.ended?'Finished':(a.paused&&a.cur<0.05)?'Ready':a.paused?'Paused':'Playing'}</b> <span class="stat">${f(a.cur)} / ${a.dur?f(a.dur):'--:--'}</span>${a.msg?` <b style="color:#FFD27A">${esc(a.msg)}</b>`:''}`;
}

/* ===================== TICK ===================== */
function tick(){
  const now=new Date();
  const c=fmtClock(now);
  document.querySelectorAll('#hClock,#tClock,.tclk').forEach(e=>e.textContent=c);
  const he=$('#hElapsed'); if(he) he.textContent = st.sessionStart?('Session time '+mmss(now-st.sessionStart)):'';
  const tc=$('#tCount'); if(tc){const d=todayAt('09:00')-now; tc.textContent = d>0?('Session begins in '+mmss(d)):''}
  const bc=$('#bCount'); if(bc){const tgt=st.breakEnd?new Date(st.breakEnd):todayAt('11:00'); $('#bTarget').textContent=fmtClock(tgt).replace(/:\d\d (AM|PM)/,' $1'); const d=tgt-now; bc.textContent=d>0?mmss(d):'RESUMING'; bc.style.color=d>0&&d<60000?'var(--red)':'var(--navy)'}
  const ot=$('#oTime'); if(ot&&st.overlay) ot.textContent=mmss(now-st.overlay.start);
  // speaker timer
  const tb=$('#spkTimer'); const T=st.timer;
  if(tb){
    const el=T.elapsedBefore+(T.running?now-T.start:0); const rem=T.dur*1000-el;
    const show=T.running||el>0;
    tb.style.display=show?'block':'none'; const lw=$('#lower'); if(lw) lw.classList.toggle('full',!show);
    if(show){ $('#spkTime').textContent = rem>=0?mmss(rem+999):'+'+mmss(-rem); $('#spkWho').textContent=T.who?hon(T.who):''; $('#spkLab').textContent=rem<0?'TIME IS UP':(T.label||'SPEAKING TIME').toUpperCase();
      tb.className = rem<0?'r':(rem<=15000?'y':'g'); }
  }
  // dock stats
  const ds=$('#dClock'); if(ds) ds.textContent=c;
  const sch=$('#dSched'); if(sch){const s=S[st.slide];const plan=todayAt(s.start);const diff=Math.round((now-plan)/60000);
    sch.className='chip '+(Math.abs(diff)<=2?'ok':diff>2?'late':'early'); sch.textContent= Math.abs(diff)<=2?'On schedule':(diff>2?`Behind ${diff} min`:`Ahead ${-diff} min`);}
  const dt=$('#dTimerBig'); if(dt){const el=T.elapsedBefore+(T.running?now-T.start:0);const rem=T.dur*1000-el;dt.textContent=rem>=0?mmss(rem+999):'+'+mmss(-rem);dt.className='tbig '+(!(T.running||el>0)?'idle':rem<0?'r':rem<=15000?'y':'')}
  const dss=$('#dSess'); if(dss) dss.textContent=st.sessionStart?'Session '+mmss(now-st.sessionStart):'';
  const pst=document.querySelector('.status'); if(pst&&!isAudience){const on=!!(audWin&&!audWin.closed); if(pst.classList.contains('on')!==on) renderControls();}
}

let resetArm=false;

/* ===================== ACTIONS ===================== */
function go(i){const n=Math.max(0,Math.min(S.length-1,i)); if(n!==st.slide){Object.assign(st.timer,{running:false,start:0,elapsedBefore:0}); st.lower=null; st.overlay=null;} st.slide=n;save();render();}
function setOverlay(t){ if(!t||(st.overlay&&st.overlay.type===t)){ if(st.overlay&&st.overlay.type==='susp') st.suspTotal+=Date.now()-st.overlay.start; st.overlay=null;} else st.overlay={type:t,start:Date.now(),reason:''}; save();render();}
function timerToggle(){const T=st.timer;if(T.running){T.elapsedBefore+=Date.now()-T.start;T.running=false}else{T.start=Date.now();T.running=true}save();render();}
function timerReset(){Object.assign(st.timer,{running:false,start:0,elapsedBefore:0});save();render();}
function startSpeaker(who,label){Object.assign(st.timer,{running:true,start:Date.now(),elapsedBefore:0,dur:st.timer.dur||60,who,label});st.lower={who,label};}
document.addEventListener('click',e=>{
  if(isAudience) return;
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act; const s=S[st.slide];
  if(a!=='reset') resetArm=false;
  switch(a){
    case 'prev': go(st.slide-1); break;
    case 'next': go(st.slide+1); break;
    case 'menu': toggleMenu(); break;
    case 'goi': go(+el.dataset.i); break;
    case 'anp': {const A=st.anthem; A.restart=(A.state==='stopped'); A.state='playing'; A.seq++; save(); render(); break;}
    case 'anr': {const A=st.anthem; A.restart=true; A.state='playing'; A.seq++; save(); render(); break;}
    case 'anz': {const A=st.anthem; A.state='paused'; A.seq++; save(); render(); break;}
    case 'ans': {const A=st.anthem; A.state='stopped'; A.seq++; save(); render(); break;}
    case 'anunpick': {st.anthem.picked=false; st.anthem.state='stopped'; st.anthem.seq++; anthemStat=null; save(); render(); break;}
    case 'vote': {const b=s.bill, id=+el.dataset.id, v=el.dataset.v; st.votes[b.cal]=st.votes[b.cal]||{}; if(st.votes[b.cal][id]===v) delete st.votes[b.cal][id]; else st.votes[b.cal][id]=v; save(); render(); break;}
    case 'ban': st.lower={who:el.dataset.who,label:el.dataset.lab}; save(); render(); break;
    case 'bant': startSpeaker(el.dataset.who,el.dataset.lab); save(); render(); break;
    case 'tp': {const id=+el.dataset.id; st.present[id]=!st.present[id]; save(); render(); break;}
    case 'tv': {const b=s.bill; const id=+el.dataset.id; st.votes[b.cal]=st.votes[b.cal]||{}; const cur=st.votes[b.cal][id]||''; const nx={'':'Y','Y':'N','N':'A','A':''}[cur]; if(nx) st.votes[b.cal][id]=nx; else delete st.votes[b.cal][id]; save(); render(); break;}
    case 'ph': {st.phase[s.bill.cal]=+el.dataset.i; save(); render(); break;}
    case 'phs': {const c=s.bill.cal; st.phase[c]=Math.max(0,Math.min(PHASES.length-1,(st.phase[c]||0)+(+el.dataset.d))); save(); render(); break;}
    case 'eov': {const c=+el.dataset.cal,i=+el.dataset.i; st.eovIdx[c]=i; st.phase[c]=Math.max(st.phase[c]||0,i<s.bill.eov.length?4:5); startSpeaker(el.dataset.who,el.dataset.tag); save(); render(); break;}
    case 'allp': MEMBERS.forEach(m=>st.present[m.id]=true); save(); render(); break;
    case 'nonep': st.present={}; save(); render(); break;
    case 'pc': {const d=+el.dataset.d; if(d<0){let k=-d; for(const m of ALPHA.slice().reverse()){if(k&&st.present[m.id]){st.present[m.id]=false;k--}}} else {let k=d; for(const m of ALPHA){if(k&&!st.present[m.id]){st.present[m.id]=true;k--}}} save(); render(); break;}
    case 'allyes': {const c=s.bill.cal; st.votes[c]=st.votes[c]||{}; MEMBERS.forEach(m=>{if(!st.votes[c][m.id] && (st.present[m.id]||presentCount()===0)) st.votes[c][m.id]='Y'}); save(); render(); break;}
    case 'clrv': st.votes[s.bill.cal]={}; save(); render(); break;
    case 'declare': {const c=s.bill.cal; st.declared[c]=!st.declared[c]; if(st.declared[c]) st.phase[c]=Math.max(st.phase[c]||0,3); save(); render(); break;}
    case 'brk': {const mm=+el.dataset.m; st.breakEnd = mm? Date.now()+mm*60000 : null; save(); render(); break;}
    case 'sess': st.sessionStart=Date.now(); save(); render(); break;
    case 'sess0': st.sessionStart=null; save(); render(); break;
    case 'aud': openAudience(); break;
    case 'pres': st._present=!st._present; save(); render(); break;
    case 'fs': toggleFS(); break;
    case 'ov': setOverlay(el.dataset.t); break;
    case 'dv': {const k=el.dataset.k; st.division[k]=Math.max(0,(st.division[k]||0)+(+el.dataset.d)); save(); render(); break;}
    case 'dreset': st.division.y=st.division.n=st.division.a=0; save(); render(); break;
    case 'tgo': timerToggle(); break;
    case 'trs': timerReset(); break;
    case 'thide': timerReset(); st.lower=null; save(); render(); break;
    case 'lshow': {const w=$('[data-act=lwho]').value; if(w){st.lower={who:w,label:$('[data-act=llab]').value}; save(); render();} break;}
    case 'lhide': st.lower=null; save(); render(); break;
    case 'lshowt': {const w=$('[data-act=lwho]').value; if(w){startSpeaker(w,$('[data-act=llab]').value); save(); render();} break;}
    case 'csv': exportCSV(); break;
    case 'reset': if(resetArm){st=defaultState(); resetArm=false; save(); render();} else {resetArm=true; renderControls();} break;
  }
});
document.addEventListener('change',e=>{
  if(isAudience) return; const el=e.target; const a=el.dataset.act; const s=S[st.slide];
  if(a==='go') go(+el.value);
  if(a==='anpick' && el.files && el.files[0]){ anthemFileObj=el.files[0]; if(anthemBlobUrl) URL.revokeObjectURL(anthemBlobUrl); anthemBlobUrl=URL.createObjectURL(anthemFileObj); anthemBlobName=anthemFileObj.name; st.anthem.picked=true; st.anthem.state='stopped'; st.anthem.seq++; anthemStat=null; sendAnthemFile(); save(); render(); }
  if(a==='anfile'){st.anthem.file=el.value.trim()||'Lupang_Hinirang.mp4'; st.anthem.state='stopped'; st.anthem.seq++; anthemStat=null; save(); render();}
  if(a==='man'){st.useManual[s.bill.cal]=el.checked; save(); render();}
  if(a==='mval'){const c=s.bill.cal; st.manual[c]=st.manual[c]||{y:0,n:0,a:0}; st.manual[c][el.dataset.k]=+el.value; save(); render();}
  if(a==='ovr'){st.override[s.bill.cal]=el.value; save(); render();}
  if(a==='tdur'){st.timer.dur=+el.value; save(); render();}
  if(a==='dmode'){st.division.mode=el.value; save(); render();}
  if(a==='dtitle'){st.division.title=el.value; save(); render();}
  if(a==='sreason'&&st.overlay){st.overlay.reason=el.value; save(); render();}
});
document.addEventListener('keydown',e=>{
  if(isAudience){ if(e.key==='f'||e.key==='F') toggleFS(); return; }
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();go(st.slide+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(st.slide-1)}
  else if(k==='t'||k==='T') timerToggle();
  else if(k==='r'||k==='R') timerReset();
  else if(k==='o'||k==='O') setOverlay('order');
  else if(k==='s'||k==='S') setOverlay('susp');
  else if(k==='d'||k==='D') setOverlay('div');
  else if(k==='q'||k==='Q') setOverlay('quorum');
  else if(k==='Escape'){ if($('#menu').style.display==='block') toggleMenu(); else setOverlay(''); }
  else if(k==='h'||k==='H'){st.lower=null;save();render()}
  else if(k==='m'||k==='M') toggleMenu();
  else if(k==='p'||k==='P'){st._present=!st._present;save();render()}
  else if(k==='f'||k==='F') toggleFS();
  else if(k==='a'||k==='A') openAudience();
  else if((k==='v'||k==='V')&&S[st.slide].type==='anthem'){const A=st.anthem; A.state=A.state==='playing'?'paused':'playing'; A.restart=false; A.seq++; save(); render();}
});
function toggleMenu(){
  const mn=$('#menu'); const on=mn.style.display!=='block';
  if(on){ mn.innerHTML=`<div style="color:var(--gold2);font-weight:800;padding:6px 10px">SLIDES</div>`+S.map((x,i)=>`<div class="mi ${i===st.slide?'cur':''}" data-go="${i}"><span class="tm">${fmt12(x.start)}</span><span>${esc(x.seg)}${x.bill&&st.declared[x.bill.cal]?' &#10003;':''}</span></div>`).join(''); }
  mn.style.display=on?'block':'none';
}
$('#menu').addEventListener('click',e=>{const it=e.target.closest('[data-go]');if(it){toggleMenu();go(+it.dataset.go)}});
function toggleFS(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}catch(e){}}
async function openAudience(){
  const url=location.href.split('#')[0]+'#audience';
  let feat='width=1280,height=720';
  try{
    if('getScreenDetails' in window){
      const sd=await window.getScreenDetails();
      const other=sd.screens.find(x=>x!==sd.currentScreen) || sd.screens.find(x=>!x.isPrimary);
      if(other) feat=`left=${other.availLeft},top=${other.availTop},width=${other.availWidth},height=${other.availHeight}`;
    }
  }catch(e){}
  if(audWin && !audWin.closed){ try{audWin.focus()}catch(e){} }
  else audWin=window.open(url,'mc_audience',feat);
  if(!audWin){ alertBox('The browser blocked the projector window. Allow pop-ups for this file, then click START PRESENTATION again.'); return; }
  setTimeout(broadcast,500); setTimeout(broadcast,1500); setTimeout(sendAnthemFile,800); setTimeout(sendAnthemFile,1800); setTimeout(renderControls,600);
}
function alertBox(msg){const c=$('#ctx'); if(c) c.innerHTML=`<div class="grp" style="background:#5A1F1A;border-color:#B5473E;font-size:14px"><b>Note</b>${esc(msg)}</div>`}
function exportCSV(){
  const head=['No.','Surname','Given name','Representation','Committee','Present',...BILLS.map(b=>'HB '+b.hb)];
  const rows=ALPHA.map((m,i)=>{const s2=sn(m.name);return [i+1,s2.s,s2.g,m.rep,m.com,st.present[m.id]?'P':'A',...BILLS.map(b=>({Y:'Yes',N:'No',A:'Abstain'}[(st.votes[b.cal]||{})[m.id]]||''))]});
  rows.push([]);rows.push(['','SUMMARY','','','','',...BILLS.map(b=>{const t=tally(b.cal);return `Y${t.y} N${t.n} A${t.a} ${st.declared[b.cal]?result(b.cal):'Pending'}`})]);
  const csv=[head,...rows].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='ISPSC_Model_Congress_Nominal_Votes.csv'; document.body.appendChild(a); a.click(); a.remove();
}

}
